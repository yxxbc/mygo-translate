name: macOS signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify native app and translation engine
        run: >-
          go test ./cmd/easydict-native ./internal/services ./internal/config
          -run 'Test(LibreTranslate|BingAutoDetect|YoudaoRejects|GoogleFallback|DetectLanguage|Selection)'
      - name: Configure release version and updater
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re

          tag = os.environ["GITHUB_REF_NAME"]
          public_key = os.environ["MYGO_UPDATER_PUBLIC_KEY"].strip()
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Expected a stable release tag, such as v0.1.0.")
          if not public_key:
              raise SystemExit("Set the MYGO_UPDATER_PUBLIC_KEY repository variable first.")
          path = pathlib.Path("mygo.json")
          config = json.loads(path.read_text())
          config.update(version=tag[1:], updates={
              "publicKey": public_key,
              "github": os.environ["GITHUB_REPOSITORY"],
          })
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
      - name: Build, sign and upload a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "Set the MYGO_UPDATER_PRIVATE_KEY secret first."; exit 1; }
          go run github.com/egoist/mygo/cmd/mygo build -platform darwin/universal -upload
